
  vectordb:
    container_name: vectordb
    image: docker.io/pgvector/pgvector:0.8.0-pg15-trixie
    restart: always
    environment:
      POSTGRES_DB: "${POSTGRES_DB:?Set POSTGRES_DB in Dokploy Environment}"
      POSTGRES_USER: "${POSTGRES_USER:?Set POSTGRES_USER in Dokploy Environment}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in Dokploy Environment}"
    volumes:
      # New volume for the new credentials; the previous pgdata2 is not deleted.
      - pgdata3:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  rag_api:
    container_name: rag_api
    image: registry.librechat.ai/librechat-ai/librechat-rag-api-dev-lite:latest
    restart: always
    env_file:
      - .env
    environment:
      - DB_HOST=${DB_HOST:-vectordb}
      - RAG_PORT=${RAG_PORT:-8000}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    depends_on:
      vectordb:
        condition: service_healthy

volumes:
  pgdata3:
  librechat-data:
  mongo-data:
  meili-data:
  librechat-images:
  librechat-uploads:
  librechat-logs:
  librechat-skill:
